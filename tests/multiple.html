<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>Multiple | Demos | ComboGrid</title>
<link rel="stylesheet" type="text/css" media="screen" href="../node_modules/jquery-ui/dist/themes/smoothness/jquery-ui.min.css"/>
<script type="text/javascript" src="../node_modules/jquery/dist/jquery.min.js"></script>
<script type="text/javascript" src="../node_modules/jquery-ui/dist/jquery-ui.min.js"></script>
<link rel="stylesheet" type="text/css" media="screen" href="../dist/css/smoothness/jquery.ui.combogrid.css"/>
<script type="text/javascript" src="../dist/js/jquery.ui.combogrid.js"></script>
<script>
jQuery(document).ready(function(){
    $( "#project" ).combogrid({
        url: 'server.php',
        debug:true,
    munit: 'px',
        searchButton: true,
        colModel: [{'columnName':'id','width':'100','label':'id'}, {'columnName':'name','width':'200','label':'title'},{'columnName':'author','width':'200','label':'author'}],
        select: function( event, ui ) {
            $( "#project" ).val( ui.item.name );
            return false;
        }
    });
    $( "#project2" ).combogrid({
        url: 'server.php',
        debug:true,
        searchButton: true,
        resetButton: true,
        colModel: [{'columnName':'id','width':'10','label':'id'}, {'columnName':'name','width':'60','label':'title'},{'columnName':'author','width':'30','label':'author'}],
        select: function( event, ui ) {
            $( "#project2" ).val( ui.item.name );
            return false;
        }
    });
});
</script>
</head>
<body>
    <div>
        <div style="float:left"><input size="30" id="project"/></div><br/>&nbsp;<br/>
        <div style="float:left"><input size="30" id="project2"/></div>
    </div>
</body>
</html>
